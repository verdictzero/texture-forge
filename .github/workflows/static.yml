# Publishes the app to GitHub Pages. There is nothing to build — Texture Forge
# is plain HTML, CSS and classic <script src> files — so the deploy is just a
# copy of one directory onto the Pages CDN.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Only the app, so index.html sits at the root of the site rather
          # than one directory down. This deliberately leaves fonts/ behind:
          # those are third-party font files with their own licences, and the
          # app never loads them.
          path: './texture-forge'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
