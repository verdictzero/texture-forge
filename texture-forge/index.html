<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Texture Forge — procedural PBR surfaces</title>
<meta name="description" content="Procedural PBR texture generator: asphalt and street layout, riveted plating, house and factory elevations, roofing, fencing, hazard striping, ruins, starship hull plating, greebles, louvres and heatsinks, rusted sheet and precast concrete — built in the browser, exported as a full channel set with glTF and OBJ geometry.">
<!-- inline so the tab has an icon without a request; served over http, an
     undeclared icon means a 404 on /favicon.ico for every visitor -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23191a1c'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='%23e6b32a'/%3E%3Ccircle cx='12.5' cy='12.5' r='3' fill='%23f6e6b0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   TEXTURE FORGE — chrome
   =====================================================================
   Two layouts out of one document, switched at 900 px.

   DESKTOP is a fixed three-region frame: a top bar that never wraps, a
   control panel you can collapse or drag wider, and a preview bay that
   takes whatever is left. Nothing in it scrolls except the panel.

   MOBILE is three PANES and a tab bar, because a phone cannot usefully
   show a 40-control panel and a preview at the same time — stacking them
   just means scrolling past one to reach the other. body[data-pane]
   picks which is on screen; the others are display:none, so the preview
   canvas keeps its build and switching back is instant.

   Everything sized for touch lives behind (pointer:coarse) rather than
   behind the width query, so a touchscreen laptop gets the big targets
   and a narrow desktop window does not.
   ===================================================================== */
:root{
  --tar:#191a1c;--tar-hi:#26282b;--tar-lo:#0f1012;--bay:#131416;
  --ink:#dcd9d3;--ink-soft:#8b8880;--paint:#ecebe6;--accent:#e6b32a;--orange:#d1500f;
  --rule:rgba(255,255,255,.09);
  --panel-w:352px;
  --top-h:48px;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --tap:34px;                     /* the minimum comfortable target, raised on touch */
  --safe-b:env(safe-area-inset-bottom,0px);
}
/* each mode carries its own accent so the tab you are on is unmistakable */
body[data-mode=street]{--accent:#e6b32a}
body[data-mode=plating]{--accent:#8fb8d8}
body[data-mode=house]{--accent:#d9a066}
body[data-mode=envelope]{--accent:#9db8a6}
body[data-mode=roof]{--accent:#b98f7a}
body[data-mode=fence]{--accent:#a5b56a}
body[data-mode=hazard]{--accent:#ff8c1a}
body[data-mode=ruins]{--accent:#57e6c9}
body[data-mode=hull]{--accent:#8ea9ff}
body[data-mode=greeble]{--accent:#c07be6}
body[data-mode=factory]{--accent:#c96a4a}
body[data-mode=diner]{--accent:#ff5c8a}
body[data-mode=vent]{--accent:#5ad1c0}
body[data-mode=sheet]{--accent:#c98a4a}
body[data-mode=plate]{--accent:#9aa8b4}
body[data-mode=slab]{--accent:#b7b2a4}
body[data-mode=grocery]{--accent:#6fbf47}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bay);color:var(--ink);font-family:Overpass,system-ui,sans-serif;
  font-size:13px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
.shell{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ the top bar ============
   One row, never wrapping. The mode strip scrolls sideways inside it rather
   than pushing the brand and the structure buttons onto a second line — at
   sixteen modes a wrapping tab bar was taking three rows and half the height
   of the preview with it. */
.topbar{display:flex;align-items:center;gap:12px;
  padding:0 12px;height:var(--top-h);flex:0 0 var(--top-h);min-width:0;
  background:linear-gradient(180deg,#232528,#17181a);
  border-bottom:1px solid #000;box-shadow:0 3px 14px rgba(0,0,0,.55);position:relative;z-index:3}
.brand{font-weight:800;font-size:15px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--paint);white-space:nowrap}
.brand em{font-style:normal;color:var(--accent)}
.modescroll{flex:1 1 auto;min-width:0;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;-ms-overflow-style:none;mask-image:linear-gradient(90deg,#000 0 96%,transparent)}
.modescroll::-webkit-scrollbar{display:none}
.modetabs{display:flex;gap:4px;padding:0 2px}
.modetab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:0 12px;height:var(--tap);flex:0 0 auto;white-space:nowrap;
  background:#1e2023;color:#8b9098;border:1px solid #33373c;border-bottom-width:2px;
  border-radius:2px;cursor:pointer}
.modetab:hover{color:var(--paint)}
.modetab[aria-pressed=true]{background:#2a2d31;color:var(--paint);border-color:#3d4146;
  border-bottom-color:var(--accent);font-weight:600}
.iconbtn{flex:0 0 auto;height:var(--tap);min-width:var(--tap);padding:0 10px;
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  background:#1e2023;color:var(--ink);border:1px solid #3a3d41;border-radius:2px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.iconbtn kbd{font-family:var(--mono);font-size:9.5px;opacity:.6;border:1px solid #4a4e53;
  border-radius:2px;padding:0 3px}
.topbar .hintline{font-family:var(--mono);font-size:10px;letter-spacing:.05em;
  text-transform:uppercase;color:#6b7078;white-space:nowrap}
@media (max-width:1400px){.topbar .hintline{display:none}}

.app{display:flex;flex:1;min-height:0;overflow:hidden}

/* ============ control panel ============ */
.panel{
  width:var(--panel-w);flex:0 0 var(--panel-w);height:100%;overflow-y:auto;position:relative;
  overscroll-behavior:contain;
  background:
    radial-gradient(circle at 20% 10%,rgba(255,255,255,.055) 0 1px,rgba(0,0,0,0) 1.4px),
    radial-gradient(circle at 70% 40%,rgba(255,255,255,.04) 0 1.2px,rgba(0,0,0,0) 1.6px),
    radial-gradient(circle at 40% 75%,rgba(255,255,255,.05) 0 1px,rgba(0,0,0,0) 1.4px),
    linear-gradient(170deg,var(--tar-hi),var(--tar) 45%,var(--tar-lo));
  background-size:23px 23px,37px 31px,29px 41px,100% 100%;
  border-right:1px solid #000;box-shadow:8px 0 26px rgba(0,0,0,.6);
}
.panel[hidden]{display:none}
body[data-panel=off] .panel{display:none}
.panel::after{content:"";position:absolute;top:0;right:7px;width:5px;height:100%;pointer-events:none;
  background:repeating-linear-gradient(180deg,var(--accent) 0 26px,rgba(0,0,0,0) 26px 46px);opacity:.8}
.panel-head{padding:16px 20px 12px;border-bottom:1px solid var(--rule)}
.panel-head h1{margin:0;font-weight:800;font-size:24px;line-height:1;text-transform:uppercase;color:var(--paint)}
.panel-head h1 em{font-style:normal;color:var(--accent)}
.panel-head p{margin:8px 0 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  color:var(--ink-soft);text-transform:uppercase}

/* find a control by name. With forty of them behind eight collapsed groups,
   knowing the word is faster than remembering the group */
.findrow{display:flex;gap:6px;padding:10px 20px;border-bottom:1px solid var(--rule)}
.findrow input{flex:1;font-family:var(--mono);font-size:11px;color:var(--ink);
  background:#141618;border:1px solid #34383d;border-radius:2px;padding:0 8px;height:var(--tap)}
.findrow input:focus{outline:none;border-color:var(--accent)}
.findrow .clearfind{display:none}
.panel[data-finding=on] .findrow .clearfind{display:inline-flex}
/* while a search is live every group opens and the misses are hidden */
.panel[data-finding=on] .group > summary{opacity:.55}
/* the explanatory notes are not what you are hunting for mid-search */
.panel[data-finding=on] .group-body > .readout{display:none}
.row.nomatch,.group.nomatch{display:none}

.presets{display:flex;flex-wrap:wrap;gap:5px;padding:12px 20px;border-bottom:1px solid var(--rule)}
.preset{font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;
  padding:0 10px;height:var(--tap);border:1px solid #3a3d41;background:#212327;color:var(--ink);
  cursor:pointer;border-radius:2px}
.preset:hover{border-color:var(--accent);color:var(--accent)}
.group{border-bottom:1px solid var(--rule)}
.group[hidden]{display:none}
.group > summary{list-style:none;cursor:pointer;padding:11px 20px;display:flex;align-items:center;gap:10px;
  font-weight:600;text-transform:uppercase;letter-spacing:.11em;font-size:12.5px;color:var(--paint);
  min-height:var(--tap)}
.group > summary::-webkit-details-marker{display:none}
.group > summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--accent);
  border-bottom:2px solid var(--accent);transform:rotate(-45deg);transition:transform .18s ease;margin-top:-3px}
.group[open] > summary::before{transform:rotate(45deg);margin-top:-6px}
.group > summary:hover{background:rgba(255,255,255,.04)}
.group-body{padding:2px 20px 16px}
.row{margin:0 0 11px}
.row[hidden]{display:none}
.row label,.row .labrow{display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:4px}
.row .labrow label{margin:0;display:block;cursor:pointer;min-width:0}
.row .val{color:var(--accent);font-weight:600;font-size:10.5px}
/* A number you can TYPE. Dragging to 4.35 when you want 4.4 is the single most
   irritating thing about a slider, and every one of these is a real dimension
   somebody may have on a drawing in front of them. */
.valbox{display:flex;align-items:baseline;gap:4px;flex:0 0 auto}
input.val{width:5.6em;text-align:right;font-family:var(--mono);font-size:10.5px;font-weight:600;
  color:var(--accent);background:transparent;border:1px solid transparent;border-radius:2px;
  padding:2px 3px;-moz-appearance:textfield}
input.val::-webkit-outer-spin-button,input.val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input.val:hover{border-color:#3a3d41}
input.val:focus{outline:none;border-color:var(--accent);background:#141618}
.unit{color:var(--ink-soft);font-size:10px}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;
  cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:#3d4045;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5.5px;
  border-radius:2px;background:var(--paint);border:1px solid #000}
input[type=range]::-moz-range-track{height:3px;background:#3d4045;border-radius:2px}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:2px;background:var(--paint);border:1px solid #000}
input[type=text]{width:100%;font-family:var(--mono);font-size:11px;color:var(--ink);
  background:#141618;border:1px solid #34383d;border-radius:2px;padding:0 8px;height:var(--tap)}
input[type=text]:focus{outline:none;border-color:var(--accent)}
select,input[type=number]{width:100%;font-family:var(--mono);font-size:11px;color:var(--ink);
  background:#212327;border:1px solid #3a3d41;border-radius:2px;padding:0 6px;height:var(--tap)}
.swatches{display:flex;gap:8px}.swatch{flex:1}
.swatch input[type=color]{width:100%;height:var(--tap);padding:0;border:1px solid #3a3d41;
  border-radius:2px;background:none;cursor:pointer}
.checks{display:flex;flex-direction:column;gap:2px}
.check{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:10.5px;
  text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);cursor:pointer;
  min-height:var(--tap)}
.check input{accent-color:var(--accent);width:16px;height:16px;flex:0 0 auto}
.seedrow{display:flex;gap:6px}.seedrow input{flex:1}
.mini{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;
  border:1px solid #3a3d41;background:#212327;color:var(--ink);padding:0 12px;height:var(--tap);
  border-radius:2px;cursor:pointer}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.readout{
  font-family:var(--mono);font-size:10px;line-height:1.55;color:var(--ink-soft);
  background:#1c1e21;border:1px solid #2c2f33;border-left:2px solid var(--accent);
  padding:8px 10px;border-radius:2px;margin:2px 0 12px;
}
.readout[hidden]{display:none}
.readout b{color:var(--paint);font-weight:600}
.readout .warn{color:var(--orange)}
.actions{position:sticky;bottom:0;padding:12px 20px calc(16px + var(--safe-b));
  background:linear-gradient(180deg,rgba(25,26,28,0),rgba(25,26,28,.97) 24%);border-top:1px solid var(--rule)}
.forge{width:100%;padding:14px;cursor:pointer;border:0;border-radius:2px;color:#1a0e05;
  background:repeating-linear-gradient(115deg,var(--orange) 0 16px,#e8691f 16px 32px);
  font-family:Overpass,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.16em;font-size:15px}
.forge:hover{filter:brightness(1.1)}
.forge:disabled{opacity:.5;cursor:progress}
.autonote{margin:9px 0 0;font-family:var(--mono);font-size:9.5px;color:var(--ink-soft);
  text-transform:uppercase;letter-spacing:.04em;text-align:center}

/* the drag handle between the panel and the bay */
.grip{flex:0 0 6px;cursor:col-resize;background:transparent;position:relative;z-index:2}
.grip:hover::after,.grip:active::after{content:"";position:absolute;inset:0 2px;background:var(--accent);opacity:.55}
body[data-panel=off] .grip{display:none}

/* ============ structures & the wizard ============ */
.structs{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.structs[hidden]{display:none}
.structlab{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;
  letter-spacing:.11em;color:var(--ink-soft);white-space:nowrap}
.structbtn{font-family:var(--mono);font-size:10px;text-transform:uppercase;
  letter-spacing:.05em;padding:0 10px;height:var(--tap);background:transparent;color:var(--accent);
  border:1px dashed var(--accent);border-radius:2px;cursor:pointer;white-space:nowrap}
.structbtn:hover{background:var(--accent);color:#1a1405;border-style:solid}
.wizbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 14px;
  background:#1c1f22;border-bottom:1px solid var(--accent);flex:0 0 auto}
.wizbar[hidden]{display:none}
.wizname{font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--paint)}
.wizsteps{display:flex;gap:2px;flex-wrap:wrap}
/* WHAT THE RAIL KNOWS ABOUT EACH FACE. A tick is a face that has been forged
   off exactly the numbers it would open with now; the recycle mark is one that
   was forged off different ones, because a later step changed something it had
   inherited. Neither is an error — a building whose back does not match its
   front is a legitimate thing to want — but you should be able to see it. */
.wizsteps .tab::after{font-weight:700;margin-left:6px;font-size:11px}
.wizsteps .tab[data-made=yes]::after{content:"✓";color:#7fc98a}
.wizsteps .tab[data-made=stale]::after{content:"↻";color:var(--orange)}
.wizsteps .tab[aria-pressed=true][data-made=yes]::after,
.wizsteps .tab[aria-pressed=true][data-made=stale]::after{color:#1a1405}
/* the 3D stage fills the bay rather than sitting in it at the texture's aspect:
   it is a room the building stands in, not a picture of a wall */
#solid{max-width:none;max-height:none;box-shadow:none;background:#0d0e10;cursor:grab}
#solid.on{display:block}
#section{max-width:none;max-height:none;box-shadow:none;background:#101214;cursor:crosshair}
#section.on{display:block}
.roadbar select{font-family:var(--mono);font-size:10px;background:#15171a;color:#d7dbe0;
  border:1px solid #2e3237;border-radius:3px;padding:2px 4px;max-width:150px}
.roadbar .seg{display:inline-flex;border:1px solid #2e3237;border-radius:4px;overflow:hidden}
.roadbar .seg .tab{border:0;border-radius:0}
.roadbar .gap{width:6px;flex:0 0 auto;border-left:1px solid #2e3237;height:18px}
.roadbar label input[type=number].xy{width:58px}
.roadbar .tab[aria-pressed=true]{background:var(--accent);color:#1a1405}
/* A BAR THAT RE-WRAPS RESIZES THE CANVAS UNDER THE CURSOR. The note in it
   changes length with every click, so it is given a height and scrolls
   inside it rather than growing into the drawing board. */
.roadbar{height:72px;overflow-y:auto;align-content:flex-start}
.roadbar .selnote{max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#section.draw{cursor:copy}
.stagetag{position:absolute;left:18px;top:12px;font-family:var(--mono);font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--accent);pointer-events:none;
  background:rgba(12,13,15,.72);padding:4px 8px;border:1px solid var(--rule);border-radius:2px}
.stagetag[hidden]{display:none}
.wiznote{flex:1 0 100%;margin:2px 0 0;font-family:var(--mono);font-size:10px;
  line-height:1.5;color:var(--ink-soft)}
/* a value this face inherited from the one before it */
.row.carried{border-left:2px solid var(--accent);margin-left:-12px;padding-left:10px}
.row.carried > label{color:var(--accent)}
body[data-wizard=on] #modebar-tabs,body[data-wizard=on] #browse{opacity:.35;pointer-events:none}

/* ============ preview bay ============ */
.bay{flex:1;min-width:0;display:flex;flex-direction:column;
  background:radial-gradient(120% 90% at 50% 0%,#1b1d1f,#0e0f11 72%)}
.bay-head{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--rule);
  flex:0 0 auto;min-width:0}
.tabscroll{flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabscroll::-webkit-scrollbar{display:none}
.tabs,.tilebtns,.bgs{display:flex;gap:2px;flex:0 0 auto}
.tabs[hidden],.tilebtns[hidden],.bgs[hidden]{display:none}
.tab{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
  padding:0 10px;height:var(--tap);flex:0 0 auto;white-space:nowrap;
  background:#1e2023;color:#8b9098;border:1px solid #2e3237;border-radius:2px;cursor:pointer}
.tab:hover{color:var(--paint)}
.tab[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#1a1405;font-weight:600}
.tab:disabled{opacity:.45;cursor:not-allowed}
.status{font-family:var(--mono);font-size:10.5px;color:#8b9098;letter-spacing:.04em;
  text-transform:uppercase;white-space:nowrap;flex:0 1 auto;min-width:0;
  overflow:hidden;text-overflow:ellipsis}
.palbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 14px;
  border-bottom:1px solid var(--rule);background:#131416;flex:0 0 auto}
/* an author rule beats the user agent's [hidden]{display:none}, so the bake
   bar sat under every view rather than only under the one channel it belongs
   to — its dozen controls do nothing to a base colour or to a building */
.palbar[hidden]{display:none}
.townbar .pallab{color:var(--accent)}
.townbar{row-gap:4px}
.townbar label{display:flex;align-items:center;gap:4px;font-family:var(--mono);
  font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:#8b929a}
.townbar label input[type=range]{width:56px}
.townbar label input[type=number]{width:52px;font-family:var(--mono);font-size:10px;
  background:#15171a;color:#d7dbe0;border:1px solid #2e3237;border-radius:3px;padding:2px 4px}
.townbar .selnote{font-family:var(--mono);font-size:10px;color:var(--accent);
  margin-left:auto;white-space:nowrap}
.palbar.drop{background:#1b1f22;box-shadow:inset 0 0 0 1px var(--accent)}
.pallab{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;
  letter-spacing:.11em;color:#9aa0a7}
.palbar select{width:auto;max-width:240px;font-size:10.5px}
.palrange{display:flex;align-items:center;width:96px}
.palrange input{width:100%}
.palswatch{display:flex;height:16px;min-width:0;flex:0 1 260px;border:1px solid #2e3237;
  background:#0a0b0c;overflow:hidden;border-radius:2px}
.palswatch i{flex:1 1 0;min-width:1px;display:block}
.bakebar{background:#101317;border-bottom:1px solid var(--rule)}
/* Two nested rows: a SET is a named cluster (Key, Ambient…), a GRP is one
   control inside it. The gap between controls has to be clearly bigger than
   the gap inside one, or a value readout and the next control's label read as
   a single label — "315° EL" instead of "315°" then "EL". */
.bakeset{display:flex;align-items:center;gap:12px}
.bakeset>span{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--accent);white-space:nowrap;opacity:.85}
.bakegrp{display:flex;align-items:center;gap:5px}
.bakegrp>span{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;
  letter-spacing:.08em;color:#7f858d;white-space:nowrap}
.bakegrp em{font-family:var(--mono);font-size:9.5px;color:#c8cdd3;font-style:normal;
  min-width:34px;text-align:right}
.bakegrp input[type=range]{width:74px}
.bakebar input[type=color]{width:26px;height:19px;padding:0;border:1px solid #2e3237;
  background:none;border-radius:2px;cursor:pointer}
.bakebar select{width:auto;max-width:190px;font-size:10.5px}
.bakesep{width:1px;align-self:stretch;background:var(--rule);margin:0 2px}
.palswatch[hidden]{display:none}
body[data-nearest=on] .stage canvas,
body[data-nearest=on] .chip canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;
  padding:16px;overflow:hidden}
.stage canvas{max-width:100%;max-height:100%;display:none;background:#000;touch-action:none;
  box-shadow:0 14px 44px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.07)}
.stage canvas.on{display:block}
.hint{position:absolute;left:18px;bottom:12px;font-family:var(--mono);font-size:10px;
  color:#6b7078;letter-spacing:.05em;text-transform:uppercase;pointer-events:none}
.tiletag{position:absolute;right:18px;bottom:12px;font-family:var(--mono);font-size:10px;
  letter-spacing:.05em;text-transform:uppercase;color:var(--accent);pointer-events:none}
.fatal{position:absolute;inset:auto 24px 24px 24px;font-family:var(--mono);font-size:11px;
  line-height:1.6;color:var(--orange);background:#1c1e21;border:1px solid var(--orange);padding:12px 14px}
.progress{position:absolute;inset:auto 0 0 0;height:2px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .12s linear}
.tray{border-top:1px solid var(--rule);padding:10px 14px 12px;background:#161719;flex:0 0 auto}
.tray-head{display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.tray-head h2{margin:0;font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.13em;color:#9aa0a7}
.trayinfo{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;color:#5f646a}
.zip{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
  padding:0 12px;height:var(--tap);border:1px solid var(--accent);background:transparent;
  color:var(--accent);border-radius:2px;cursor:pointer}
.zip:hover{background:var(--accent);color:#1a1405}
.zip:disabled{opacity:.5;cursor:progress}
.zip[hidden]{display:none}
.zipsave{text-decoration:none;border-color:var(--orange);color:var(--orange);
  display:inline-flex;align-items:center;line-height:1.35}
.zipsave:hover{background:var(--orange);color:#fff}
.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px;align-items:flex-end;
  scrollbar-width:thin}
.chip{flex:0 0 auto;width:88px;text-align:center}
.chip canvas{width:88px;display:block;border:1px solid #2e3237;background:#0a0b0c}
.chip button{width:100%;margin-top:4px;font-family:var(--mono);font-size:9px;letter-spacing:.03em;
  text-transform:uppercase;padding:5px 2px;border:1px solid #2e3237;background:#1e2023;color:#8b9098;
  border-radius:2px;cursor:pointer}
.chip button:hover{background:var(--accent);color:#1a1405;border-color:var(--accent)}

/* ============ the mode browser ============
   Sixteen modes is past the point where a strip of tabs is a way of FINDING
   one. This is the same list grouped, described and searchable, over the top
   of everything — and on a phone it is the only mode picker there is. */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(8,9,10,.72);
  display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet[hidden]{display:none}
.sheet-card{width:min(880px,100%);max-height:88vh;display:flex;flex-direction:column;
  background:linear-gradient(170deg,var(--tar-hi),var(--tar) 55%,var(--tar-lo));
  border:1px solid #3a3d41;border-radius:4px;box-shadow:0 30px 80px rgba(0,0,0,.75);overflow:hidden}
.sheet-head{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--rule)}
.sheet-head input{flex:1;font-family:var(--mono);font-size:13px;color:var(--paint);
  background:#141618;border:1px solid #34383d;border-radius:2px;padding:0 10px;height:40px}
.sheet-head input:focus{outline:none;border-color:var(--accent)}
.sheet-body{overflow-y:auto;padding:6px 14px 16px;overscroll-behavior:contain}
.modegroup{margin-top:14px}
.modegroup h3{margin:0 0 8px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-soft)}
.modegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.modecard{text-align:left;padding:10px 12px;background:#1e2023;border:1px solid #33373c;
  border-left:3px solid #33373c;border-radius:2px;cursor:pointer;color:var(--ink)}
.modecard:hover,.modecard.on{border-color:var(--accent);border-left-color:var(--accent);background:#25282c}
.modecard b{display:block;font-size:13px;color:var(--paint);text-transform:uppercase;letter-spacing:.08em}
.modecard span{display:block;margin-top:3px;font-family:var(--mono);font-size:10px;line-height:1.45;
  color:var(--ink-soft)}
.modecard[aria-current=true]{border-left-color:var(--accent);background:#2a2d31}
.sheet-foot{padding:10px 14px;border-top:1px solid var(--rule);font-family:var(--mono);
  font-size:10px;letter-spacing:.05em;color:#6b7078;text-transform:uppercase}
.nohits{font-family:var(--mono);font-size:11px;color:var(--ink-soft);padding:20px 4px}

/* ============ the mobile tab bar ============ */
.tabbar{display:none}

@media (max-width:900px){
  .shell{height:100vh;height:100dvh}
  .topbar{gap:8px;padding:0 8px}
  .brand{font-size:13px;letter-spacing:.1em}
  .topbar .hintline,.modescroll{display:none}   /* the browser sheet is the picker here */
  .structs{margin-left:auto}
  .structlab{display:none}

  .app{display:block;flex:1;min-height:0;overflow:hidden;position:relative}
  .grip{display:none}
  /* one pane at a time. The others are display:none rather than unmounted, so
     the preview keeps its build and coming back is instant. */
  .panel{position:absolute;inset:0;width:100%;flex:none;height:100%;
    border-right:0;box-shadow:none;display:none}
  .panel::after{display:none}
  .bay{position:absolute;inset:0;display:none}
  body[data-pane=controls] .panel:not([hidden]){display:block}
  body[data-pane=preview] .bay,body[data-pane=export] .bay{display:flex}
  body[data-pane=export] .bay-head,
  body[data-pane=export] .palbar,
  body[data-pane=export] .bakebar,
  body[data-pane=export] .stage{display:none}
  body[data-pane=preview] .tray{display:none}
  body[data-pane=export] .tray{flex:1;min-height:0;overflow-y:auto}
  body[data-pane=export] .chips{flex-wrap:wrap;overflow:visible}

  .tabbar{display:flex;flex:0 0 auto;border-top:1px solid #000;background:#17181a;
    padding-bottom:var(--safe-b);box-shadow:0 -3px 14px rgba(0,0,0,.55);z-index:4}
  .tabbar button{flex:1;height:52px;background:none;border:0;color:#8b9098;cursor:pointer;
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    border-top:2px solid transparent}
  .tabbar button i{font-style:normal;font-size:15px;line-height:1}
  .tabbar button[aria-pressed=true]{color:var(--accent);border-top-color:var(--accent)}

  /* the channel tabs get their own line: squeezed onto the same row as the
     tile buttons and the status they were being flexed down to nothing */
  .bay-head{flex-wrap:wrap;gap:8px 10px}
  .tabscroll{flex:1 1 100%;order:-1}
  /* and the palette bar stays one line and scrolls, rather than wrapping into
     three and eating a third of the screen */
  .palbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .palbar::-webkit-scrollbar{display:none}
  .palbar > *{flex:0 0 auto}
  .palswatch{flex:0 0 200px}
  #structhost .structs{flex-wrap:wrap}
  .panel-head{padding:14px 16px 10px}
  .panel-head h1{font-size:21px}
  .group-body,.presets,.findrow{padding-left:16px;padding-right:16px}
  .actions{padding:12px 16px 16px}
  .wizbar{padding:8px 10px}
  .palswatch{flex-basis:100%}
  .sheet{padding:0}
  .sheet-card{width:100%;max-height:100%;height:100%;border:0;border-radius:0}
  .stage{padding:10px}
}

/* Touch, not width: a touchscreen laptop wants the big targets and a narrow
   desktop window does not. */
@media (pointer:coarse){
  :root{--tap:42px}
  .iconbtn kbd{display:none}          /* no keyboard, no shortcut worth showing */
  input[type=range]{height:34px}
  input[type=range]::-webkit-slider-runnable-track{height:5px}
  input[type=range]::-webkit-slider-thumb{width:24px;height:24px;margin-top:-9.5px;border-radius:3px}
  input[type=range]::-moz-range-track{height:5px}
  input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:3px}
  input.val{font-size:12px;width:5.2em;border-color:#3a3d41}
  .check input{width:20px;height:20px}
  .chip{width:104px}.chip canvas{width:104px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-pane="preview" data-panel="on">

<div class="shell">

  <header class="topbar" id="topbar">
    <div class="brand">Texture <em>Forge</em></div>
    <button type="button" class="iconbtn" id="panelbtn" title="Show or hide the controls (P)"
            aria-label="Toggle the control panel">▤</button>
    <div class="modescroll"><div class="modetabs" id="modebar-tabs"></div></div>
    <button type="button" class="iconbtn" id="browse" title="Browse every mode">
      Modes <kbd>K</kbd></button>
    <div class="structs" id="structs"></div>
    <div class="hintline" id="hintline">One tool · one mode per surface · PBR + glTF out</div>
  </header>

  <div class="wizbar" id="wizbar" hidden>
    <span class="wizname" id="wiz-name"></span>
    <div class="wizsteps" id="wiz-steps"></div>
    <button type="button" class="tab" id="wiz-back">Back</button>
    <button type="button" class="tab" id="wiz-next">Next</button>
    <button type="button" class="tab" id="wiz-see">Forge every face</button>
    <button type="button" class="zip" id="wiz-all">Build &amp; zip every face</button>
    <button type="button" class="tab" id="wiz-exit">Leave the wizard</button>
    <p class="wiznote" id="wiz-note"></p>
  </div>

  <div class="app" id="app">
    <!-- mode panels are inserted here by forge-core.js -->
    <div class="grip" id="grip" title="Drag to resize the panel"></div>

    <div class="bay" id="bay">
      <div class="bay-head">
        <div class="tabscroll"><div class="tabs" id="tabs"></div></div>
        <div class="tilebtns" id="tiles">
          <button class="tab" data-tile="1" aria-pressed="true">1×1</button>
          <button class="tab" data-tile="2" aria-pressed="false">2×2</button>
          <button class="tab" data-tile="4" aria-pressed="false">4×4</button>
        </div>
        <div class="bgs" id="bgs" hidden>
          <button class="tab" data-bg="dark" aria-pressed="true">Dark</button>
          <button class="tab" data-bg="sky" aria-pressed="false">Sky</button>
          <button class="tab" data-bg="check" aria-pressed="false">Checker</button>
        </div>
        <div class="status" id="status">Ready</div>
      </div>

      <div class="palbar" id="palbar">
        <span class="pallab">Palette</span>
        <select id="pal-set" title="Snap the base colour to a fixed set of colours"></select>
        <select id="pal-dither" title="How the error left over from the snap is spread"></select>
        <label class="palrange" title="Dither amount">
          <span class="sr">Dither amount</span>
          <input id="pal-strength" type="range" min="0" max="1.6" step="0.05" value="1">
        </label>
        <button type="button" class="tab" id="pal-load">Load palette…</button>
        <button type="button" class="tab" id="pal-drop" hidden>Drop it anywhere on this bar</button>
        <input type="file" id="pal-file" hidden
               accept="image/*,.hex,.txt,.gpl,.pal,.json,.css,.act">
        <button type="button" class="tab" id="pal-forget" hidden title="Remove this loaded palette">Forget</button>
        <button type="button" class="tab" id="pal-near" aria-pressed="true"
                title="Show the textures unsmoothed, one screen pixel per texel">Nearest</button>
        <div class="palswatch" id="pal-swatch" aria-hidden="true"></div>
      </div>

      <!-- Filled by the runtime from one spec, the way a mode panel is: there
           are a dozen controls here and hand-written markup for them would be
           a dozen places to forget to update. Shown only on the Unlit tab. -->
      <div class="palbar bakebar" id="bakebar" hidden></div>

      <!-- THE TOWN'S OWN BAR. A street grid is not a texture, so its numbers do
           not belong in a mode's panel; they belong with the picture of the
           town, next to the thing they move. Built in script, because the row
           it needs is the same eight controls whatever is loaded. -->
      <div class="palbar townbar" id="townbar" hidden></div>

      <!-- THE ROAD'S OWN BAR, and its drawing board. A cross-section is not a
           texture either: its nodes live on a canvas you drag them about on,
           and its length, bend and decay live next to the picture they move.
           The section canvas takes the stage's place in the 2D views. -->
      <div class="palbar townbar roadbar" id="roadbar" hidden></div>

      <div class="stage" id="stage">
        <canvas id="gl" class="on" width="900" height="900"></canvas>
        <canvas id="flat" width="900" height="900"></canvas>
        <!-- the wizard's 3D building. Off in every other view, and never
             offered at all where there is no WebGL. -->
        <canvas id="solid" width="900" height="900"></canvas>
        <!-- the road's 2D designer and plan: drawn in script, on top of the
             3D view's place, only while a road structure asks for it -->
        <canvas id="section" width="900" height="900"></canvas>
        <div class="hint" id="hint">Drag the preview to move the light</div>
        <div class="stagetag" id="stagetag" hidden></div>
        <div class="tiletag" id="tiletag"></div>
        <div class="progress"><i id="bar"></i></div>
      </div>

      <div class="tray">
        <div class="tray-head">
          <h2>Channels</h2>
          <button type="button" class="zip" id="zipall">Download all as .zip</button>
          <button type="button" class="zip" id="h16">Height 16-bit</button>
          <a class="zip zipsave" id="zipsave" hidden></a>
          <span class="trayinfo" id="trayinfo"></span>
        </div>
        <div class="chips" id="chips"></div>
      </div>
    </div>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Panes">
    <button type="button" data-pane="controls" aria-pressed="false"><i>▤</i>Controls</button>
    <button type="button" data-pane="preview"  aria-pressed="true"><i>◧</i>Preview</button>
    <button type="button" data-pane="export"   aria-pressed="false"><i>▼</i>Export</button>
  </nav>
</div>

<div class="sheet" id="modesheet" hidden role="dialog" aria-modal="true" aria-label="Choose a mode">
  <div class="sheet-card">
    <div class="sheet-head">
      <input id="modesearch" type="search" placeholder="Search modes — brick, rust, neon, heatsink…"
             autocomplete="off" spellcheck="false">
      <button type="button" class="iconbtn" id="modeclose" aria-label="Close">Esc</button>
    </div>
    <div class="sheet-body" id="modegrid"></div>
    <div class="sheet-foot" id="modefoot"></div>
  </div>
</div>

<!-- The runtime first, then one file per mode. Adding a mode is a new file
     here plus modes/<name>.js — nothing else in the app needs to change. -->
<script src="forge-math.js"></script>
<script src="forge-palette.js"></script>
<script src="forge-unlit.js"></script>
<script src="forge-fonts.js"></script>
<script src="forge-gpu.js"></script>
<script src="forge-model.js"></script>

<script src="modes/street.js"></script>
<script src="modes/plating.js"></script>
<script src="modes/lib/micro.js"></script>
<script src="modes/lib/house-shell.js"></script>
<script src="modes/house.js"></script>
<script src="modes/lib/roof.js"></script>
<script src="modes/envelope.js"></script>
<script src="modes/roof.js"></script>
<script src="modes/fence.js"></script>
<script src="modes/hazard.js"></script>
<script src="modes/ruins.js"></script>
<script src="modes/lib/quilt.js"></script>
<script src="modes/hull.js"></script>
<script src="modes/greeble.js"></script>
<script src="modes/factory.js"></script>

<script src="modes/grocery.js"></script>
<script src="modes/vent.js"></script>

<script src="modes/lib/road.js"></script>
<script src="modes/lib/loom.js"></script>
<script src="modes/conduit.js"></script>
<script src="modes/raceway.js"></script>

</body>
